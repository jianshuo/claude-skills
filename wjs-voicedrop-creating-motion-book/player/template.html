<title>{{TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 公用放映厅（wjs-voicedrop-creating-motion-book/player）：画面 9:16 占满宽度，下面一条 70px 深色控制条（按 Claude Design「视频播放器」稿，2026-10-26）。
   暂停时画面压暗、正中一个毛玻璃大播放键；点画面任意处切换播放/暂停。
   时间永远取口播 <audio> 的 currentTime，画面每帧实时画（不经 MP4）。 */
:root {
  --bg: #0d1117; --ink: #fff; --sub: rgba(255,255,255,.9); --track: rgba(255,255,255,.25); --fill: #fff;
  --ui: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--ui); overflow: hidden; -webkit-tap-highlight-color: transparent; }
.stage { height: 100%; display: flex; align-items: center; justify-content: center; box-sizing: border-box;
  padding: 12px max(12px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(12px, env(safe-area-inset-left, 0px)); }
/* 画面＋控制条是一个整体，宽 W；里面所有尺寸都按 W 的百分比（cqw，设计稿画面宽 366px：1cqw = 3.66px），任何手机比例一致。
   总高 = W×16/9（画面）＋ W×0.1913（控制条 70/366）= W×1.9691，所以 W 取「可用宽」和「可用高 ÷ 1.9691」里小的那个。 */
.player { container-type: inline-size; flex: none;
  width: min(calc(100vw - 24px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)), calc((100vh - 12px - env(safe-area-inset-bottom, 0px)) / 1.9691));
  width: min(calc(100vw - 24px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)), calc((100dvh - 12px - env(safe-area-inset-bottom, 0px)) / 1.9691)); }
.frame { position: relative; width: 100%; aspect-ratio: 9 / 16; border-radius: 1.64cqw; overflow: hidden; background: #10181b; cursor: pointer; }
#c { width: 100%; height: 100%; display: block; }
.cover { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4.4cqw; background: rgba(0,0,0,.28); }
.cover[hidden] { display: none; }   /* 上面 display:flex 会盖过浏览器默认的 [hidden]，不写这行暂停遮罩永远不消失 */
.big { width: 30.6cqw; height: 30.6cqw; border-radius: 999px; padding: 0; background: rgba(40,40,40,.55); border: 1px solid rgba(255,255,255,.18);
  backdrop-filter: blur(24px) saturate(1.4); -webkit-backdrop-filter: blur(24px) saturate(1.4); box-shadow: 0 3.3cqw 10.9cqw rgba(0,0,0,.35);
  display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform .1s; }
.big:active { transform: scale(.96); }
.big svg { width: 12cqw; height: 13.66cqw; margin-left: 2.19cqw; }
.status { font-size: 3.55cqw; color: var(--sub); text-align: center; padding-inline: 4.4cqw; text-shadow: 0 1px 4px rgba(0,0,0,.6); }
.status:empty { display: none; }
.bar { width: 100%; height: 19.13cqw; box-sizing: border-box; padding-right: 1.1cqw; display: flex; align-items: center; gap: 2.73cqw; }
.pp { flex: none; width: 14.2cqw; height: 14.2cqw; border-radius: 999px; border: 0; padding: 0; background: none; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform .1s; }
.pp:hover { background: rgba(255,255,255,.1); }
.pp:active { transform: scale(.94); }
.pp .i-play { width: 6.56cqw; height: 7.65cqw; margin-left: 1.09cqw; }
.pp .i-pause { width: 6.01cqw; height: 7.1cqw; }
.pp .i-pause, .pp.on .i-play { display: none; }
.pp.on .i-pause { display: block; }
.big:focus-visible, .pp:focus-visible, .track:focus-visible { outline: 2px solid #f0b43c; outline-offset: 2px; }
.tm { flex: none; font-size: 3.55cqw; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--sub); }
#cur { min-width: 10.9cqw; }
#remain { min-width: 13.1cqw; text-align: right; }
.track { flex: 1; min-width: 0; height: 9.84cqw; display: flex; align-items: center; cursor: pointer; touch-action: none; }
.rail { position: relative; width: 100%; height: 1.64cqw; border-radius: 999px; background: var(--track); transition: height .15s; }
.track.drag .rail { height: 2.73cqw; }
.done { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 999px; background: var(--fill); }
.knob { position: absolute; top: 50%; left: 0; width: 6.01cqw; height: 6.01cqw; margin: -3cqw 0 0 -3cqw; border-radius: 999px; background: #fff; box-shadow: 0 .55cqw 1.64cqw rgba(0,0,0,.4); }
</style>

<div class="stage">
  <div class="player">
    <div class="frame" id="frame">
      <canvas id="c" width="1080" height="1920"></canvas>
      <div class="cover" id="cover">
        <button class="big" id="big" type="button" aria-label="播放">
          <svg width="44" height="50" viewBox="0 0 44 50" aria-hidden="true"><path d="M4 3.5v43a2.5 2.5 0 0 0 3.8 2.1l34-21.5a2.5 2.5 0 0 0 0-4.2L7.8 1.4A2.5 2.5 0 0 0 4 3.5z" fill="#fff"/></svg>
        </button>
        <div class="status" id="status">正在加载画面和口播…</div>
      </div>
    </div>
  <div class="bar">
    <button class="pp" id="pp" type="button" aria-label="播放或暂停">
      <svg class="i-play" width="24" height="28" viewBox="0 0 30 34" style="margin-left:4px" aria-hidden="true"><path d="M3 2.5v29a2 2 0 0 0 3 1.7l22.6-14.5a2 2 0 0 0 0-3.4L6 .8A2 2 0 0 0 3 2.5z" fill="#fff"/></svg>
      <svg class="i-pause" width="22" height="26" viewBox="0 0 28 32" aria-hidden="true"><rect x="3" y="1" width="8" height="30" rx="2" fill="#fff"/><rect x="17" y="1" width="8" height="30" rx="2" fill="#fff"/></svg>
    </button>
    <span class="tm" id="cur">0:00</span>
    <div class="track" id="track" role="slider" tabindex="0" aria-label="进度" aria-valuemin="0" aria-valuemax="{{TOTAL}}" aria-valuenow="0">
      <div class="rail"><div class="done" id="done"></div><div class="knob" id="knob"></div></div>
    </div>
    <span class="tm" id="remain">-{{MMSS}}</span>
  </div>
  </div>
  <div hidden><input id="scrub" type="range"><span id="tt"></span><button id="play" type="button"></button></div>
</div>

<script>window.FONT_FACES = [];</script>
<script charset="utf-8" src="lib/util.js"></script>
<script>U.loadCmaps = async () => {}; U.assertGlyphs = () => true;</script>
{{LIBTAGS}}
<script charset="utf-8" src="{{ERAS}}"></script>
<script>window.SCENE_LIBS = []; window.SCENES = window.SCENES || {};</script>
<script charset="utf-8" src="transitions.js"></script>
{{SCENETAGS}}
<script charset="utf-8" src="scenes/index.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const frame = $('frame'), cover = $('cover'), status = $('status'), pp = $('pp'), track = $('track'), done = $('done'), knob = $('knob'), cur = $('cur'), remain = $('remain');
  const audio = new Audio(); audio.preload = 'auto';
  const fmt = s => { s = Math.max(0, Math.floor(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
  let total = {{TOTAL}}, ready = false, playing = false, dragging = false, wake = null;

  const loadFonts = Promise.all({{FONTS}}.map(async ([fam, url]) => { const buf = await (await fetch(url)).arrayBuffer(); const f = new FontFace(fam, buf); await f.load(); document.fonts.add(f); }));
  const loadAudio = fetch('narration.mp3').then(r => r.blob()).then(b => { audio.src = URL.createObjectURL(b); });

  const show = t => { const p = Math.min(1, t / total) * 100 + '%'; done.style.width = p; knob.style.left = p;
    cur.textContent = fmt(t); remain.textContent = '-' + fmt(total - t); track.setAttribute('aria-valuenow', t.toFixed(0)); };

  Promise.all([loadFonts, loadAudio]).then(() => {
    const s = document.createElement('script'); s.charset = 'utf-8'; s.src = 'engine.js'; document.body.appendChild(s);
    const wait = () => { if (window.__bootFailed) { status.textContent = '画面加载失败：' + String(window.__bootFailed).slice(0, 120); return; }
      if (!window.__ready) return requestAnimationFrame(wait);
      ready = true; total = window.__total || total; track.setAttribute('aria-valuemax', total.toFixed(0)); show(0);
      status.textContent = ''; window.renderFrame(0.6); };
    wait();
  }).catch(e => { status.textContent = '加载失败：' + e.message; });

  const loop = () => {
    if (!playing) return;
    const t = Math.min(audio.currentTime, total - 0.01); window.renderFrame(t); if (!dragging) show(t);
    if (audio.ended || audio.currentTime >= total - 0.02) { pause(); window.renderFrame(total - 0.01); return; }
    requestAnimationFrame(loop);
  };
  const play = async () => { if (!ready) return; try { await audio.play(); } catch (e) { status.textContent = '浏览器没有允许播放声音，请再点一次'; return; }
    playing = true; cover.hidden = true; status.textContent = ''; pp.classList.add('on'); requestAnimationFrame(loop);
    try { wake = await navigator.wakeLock?.request('screen'); } catch (e) {} };
  const pause = () => { playing = false; audio.pause(); cover.hidden = false; pp.classList.remove('on'); try { wake?.release(); } catch (e) {} wake = null; };
  const toggle = () => playing ? pause() : play();
  const jump = t => { t = Math.max(0, Math.min(total - 0.01, t)); audio.currentTime = t; show(t); if (ready && !playing) window.renderFrame(t); };

  frame.addEventListener('click', toggle);   // 大播放键在画面里，点击冒泡到这里，不另绑
  pp.addEventListener('click', toggle);
  // 进度条：按下即跳、拖动跟手（拖动时条加粗到 10px）
  const seekAt = e => { const r = track.getBoundingClientRect(); jump((e.clientX - r.left) / r.width * total); };
  track.addEventListener('pointerdown', e => { if (!ready) return; dragging = true; track.classList.add('drag'); track.setPointerCapture(e.pointerId); seekAt(e); });
  track.addEventListener('pointermove', e => { if (dragging) seekAt(e); });
  const up = () => { dragging = false; track.classList.remove('drag'); };
  track.addEventListener('pointerup', up); track.addEventListener('pointercancel', up);
  track.addEventListener('keydown', e => { const d = { ArrowLeft: -15, ArrowRight: 15 }[e.key]; if (d && ready) { e.preventDefault(); jump(audio.currentTime + d); } });
  document.addEventListener('keydown', e => { if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); toggle(); } });
})();
</script>
